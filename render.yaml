# Render Blueprint for the Rivals API.
#
# One-time setup: https://dashboard.render.com → New → Blueprint → pick this
# repo. Render reads this file, creates the service, and then auto-deploys on
# every push to main. Env vars marked `sync: false` must be pasted once in the
# dashboard (values live in the root .env / plans/manual-tasks-complete-guide.txt).

services:
  - type: web
    name: rivals-api
    runtime: node
    plan: free
    region: singapore # closest to Supabase ap-south-1 (Mumbai)
    # `corepack enable` fails on Render: it tries to replace /usr/bin/pnpm on a
    # read-only filesystem (EROFS). npx runs the pinned pnpm from the writable
    # npm cache instead.
    # --prod=false is required: NODE_ENV=production makes pnpm skip
    # devDependencies, and the build tool (esbuild) lives there.
    buildCommand: npx --yes pnpm@9.12.3 install --frozen-lockfile --prod=false && npx --yes pnpm@9.12.3 --filter @rivals/api build
    startCommand: node packages/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # engines.node is ">=20", which made Render pick Node 26. Pin it.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000" # Render routes traffic to $PORT (10000); the API reads API_PORT
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: rivals-proofs
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

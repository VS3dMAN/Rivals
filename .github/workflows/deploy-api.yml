name: Deploy API (staging)

# Render auto-deploys from GitHub when the Blueprint (render.yaml) is set up,
# so this workflow only (1) sanity-builds the API and (2) pings the optional
# Render deploy hook for setups without the GitHub integration. The hook step
# is skipped unless the RENDER_DEPLOY_HOOK_CONFIGURED repo variable is 'true'.

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-api
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose - action-setup errors out if the version
      # is set both here and in package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @rivals/api build

      - name: Trigger Render deploy hook
        if: ${{ vars.RENDER_DEPLOY_HOOK_CONFIGURED == 'true' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
